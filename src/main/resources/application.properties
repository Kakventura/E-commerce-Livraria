# PostgreSQL (valores padrão batem com o docker-compose.yml; sobrescreva por variável de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livraria}
spring.datasource.username=${DB_USER:livraria}
spring.datasource.password=${DB_PASSWORD:livraria}

# Cria/atualiza as tabelas a partir das entidades (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
